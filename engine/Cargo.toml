[package]
name = "pulsefold"
version = "0.1.0"
edition = "2021"
rust-version = "1.65"

[lib]
crate-type = ["rlib", "cdylib"]

# The browser build: `cargo build --profile wasm --target wasm32-unknown-unknown --lib`.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
